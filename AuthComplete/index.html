<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111214">
<title>Authenticated</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@8..144,100..1000&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#111214;--surf:#1a1b1e;--surf2:#232529;--text:#f2f2f2;--muted:#c7c7c7;--pri:#a5abf3;--onpri:#111214;--tonal:#2e3170;--ontonal:#dfe0ff;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Google Sans Flex",system-ui,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(720px,100%);background:var(--surf);border:1px solid var(--line);border-radius:40px 40px 40px 96px;padding:56px 32px 48px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:32px}
.ok{width:72px;height:72px;border-radius:24px;background:var(--tonal);color:var(--ontonal);display:grid;place-items:center}
.ms{font-family:"Material Symbols Rounded";font-size:40px;line-height:1;font-weight:400;font-feature-settings:"liga";font-variation-settings:"FILL" 1}
h1{margin:0;font-size:clamp(32px,6vw,52px);line-height:1.05;letter-spacing:-.04em;font-weight:800;max-width:14ch}
.icons{display:flex;align-items:center;gap:28px}
.icon{width:64px;height:64px;object-fit:contain;border-radius:18px;background:var(--surf2)}
.plus{font-size:44px;font-weight:700;line-height:1;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{appearance:none;border:0;min-width:176px;height:56px;padding:0 24px;border-radius:999px;background:var(--pri);color:var(--onpri);font:inherit;font-weight:700;cursor:pointer;transition:border-radius .16s,transform .05s}
.btn.t{background:var(--tonal);color:var(--ontonal)}
.btn:hover{border-radius:18px}.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="ok"><span class="ms">check</span></div>
  <h1>Thanks for authenticating</h1>
  <div class="icons" aria-label="Discord plus Swifty">
    <img class="icon" src="./Discord.svg" alt="Discord">
    <div class="plus">+</div>
    <img class="icon" src="../packaging/icons/swiftify-64.png" alt="Swifty">
  </div>
  <div class="row" role="group" aria-label="Open apps">
    <button class="btn" id="openDiscord">Open Discord</button>
    <button class="btn t" id="openSwifty">Open Swifty</button>
  </div>
</main>
<script>
document.getElementById("openDiscord").addEventListener("click",()=>{window.location.href="discord://"});
document.getElementById("openSwifty").addEventListener("click",()=>{window.location.href="swifty://open"});
</script>
</body>
</html>
