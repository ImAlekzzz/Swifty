specfile_path: packaging/rpm/swifty.spec
upstream_package_name: swifty
upstream_tag_template: v{version}

jobs:
  - job: copr_build
    trigger: commit
    owner: imalekz
    project: Swifty
    enable_net: true
    targets:
      - fedora-all-x86_64
      - fedora-all-aarch64
      - opensuse-tumbleweed-x86_64
      - opensuse-tumbleweed-aarch64
